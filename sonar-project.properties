sonar.projectKey=aaronaco_aa-toolkit
sonar.organization=aaronaco

sonar.sources=packages/aa-cli/src,.github
sonar.tests=packages/aa-cli/tests

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml

# S8541 asks for uv's --no-build flag, which can't install the aa-cli workspace
# package because it has no wheel.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/ci.yml
