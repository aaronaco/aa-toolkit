# uv isn't listed on purpose: Dependabot has open bugs affecting uv workspaces
# like this one, so uv dependencies are updated by hand with `uv`. They get their own
# 7-day cooldown from `exclude-newer` in pyproject.toml.
# https://github.com/dependabot/dependabot-core/issues/14004
# https://github.com/dependabot/dependabot-core/issues/15786
version: 2
updates:
  - package-ecosystem: github-actions
    # The CLI's workflow templates (ADR 0009). Dependabot reads the .yml files directly inside
    # this folder, so only workflow templates go there.
    directories: ["/", "/packages/aa-toolkit-cli/src/aa_cli/templates/workflows"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps) # Dependabot adds the colon
    groups:
      github-actions:
        patterns: ["*"]
