name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.15"] # the version pinned in .python-version
        include:
          - os: ubuntu-latest
            python: "3.14" # the lowest supported version
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
      - run: uv python install
      - run: uv sync --locked
      # Before prek, which also runs ty: a failed step skips the ones after it,
      # and only this step gives the GitHub annotations.
      - run: uv run --locked ty check --output-format github
      - run: uv run --locked prek run --all-files --show-diff-on-failure
        env:
          PREK_SKIP: no-commit-to-branch # it fails on pushes to main
      - run: uv run --locked pytest

  log-library-alone:
    name: Log library alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - run: uv python install
      # Not uv sync: all workspace members share one .venv, where an undeclared import still works.
      - run: uv run --locked --isolated --no-default-groups --package aa-toolkit-log python -I packages/aa-toolkit-log/tests/alone_app.py

  redact-library-alone:
    name: Redact library alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - run: uv python install
      # Not uv sync, for the same reason as the log library's check.
      - run: uv run --locked --isolated --no-default-groups --package aa-toolkit-redact python -I packages/aa-toolkit-redact/tests/alone_app.py

  sonar:
    name: SonarQube analysis
    # Pull requests from forks and from Dependabot can't read the token.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the analysis needs git history to tell which code is new
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked pytest --cov=aa_cli --cov=aa_log --cov=aa_redact --cov-report=xml
      - uses: SonarSource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
