# Squash merges are made on GitHub, so local hooks never see the title that
# becomes the commit subject on main.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize] # edited: when the title changes

permissions: {}

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: [^[:space:]]|Revert ")'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::The PR title must be Conventional Commits, like: feat(cli): add a flag"
            exit 1
          fi
