name: uv audit

on:
  schedule:
    - cron: "23 6 * * 1" # every Monday
  pull_request:
    paths:
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uv-audit:
    name: uv audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.7"
      # --locked never changes uv.lock, and fails if it's out of date.
      - run: uv audit --locked --preview-features audit-command
