# Fails when .github/workflows/actions.lock is out of sync with the workflows,
# or a locked commit is no longer in the history of its upstream ref.
name: actions-lock

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: actions-lock verify
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Dependabot doesn't cover gh extensions, so upgrade this pin by hand.
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
