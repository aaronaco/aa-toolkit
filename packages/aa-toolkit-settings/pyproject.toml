[project]
name = "aa-toolkit-settings"
version = "0.1.0"
description = "Settings for apps, on top of pydantic-settings."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "keyring>=25.7.0",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aa_settings"
