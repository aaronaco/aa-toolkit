[project]
name = "aa-cli"
version = "0.1.0"
description = "The aa command."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.3",
    "urllib3==1.26.4",
]

[project.scripts]
aa = "aa_cli.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
