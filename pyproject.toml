[project]
name = "aa-toolkit"
version = "0.0.0"
description = "Workspace root of the aa toolkit."
requires-python = ">=3.14"
dependencies = ["aa-toolkit-cli", "aa-toolkit-log", "aa-toolkit-redact", "aa-toolkit-settings"]

[tool.uv]
package = false
required-version = "==0.13.7"  # exact: CI reads it, and setup-uv installs the top match of a range
exclude-newer = "7 days"  # cooldown: skip any file uploaded less than 7 days ago

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
aa-toolkit-cli = { workspace = true }
aa-toolkit-log = { workspace = true }
aa-toolkit-redact = { workspace = true }
aa-toolkit-settings = { workspace = true }

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.99",
    "zizmor>=1.32.0",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/aa-toolkit-cli/tests",
    "packages/aa-toolkit-log/tests",
    "packages/aa-toolkit-redact/tests",
    "packages/aa-toolkit-settings/tests",
]
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
branch = true
relative_files = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "PYI", "S"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["ANN", "S101", "S603", "S607"]  # tests assert and run git and uv by name

[tool.ruff.lint.isort]
known-first-party = ["aa_cli", "aa_log", "aa_redact", "aa_settings"]

# ADR 0001: a library never imports another library. The CLI may import them, so it isn't listed
# in the first contract.
[tool.importlinter]
root_packages = ["aa_cli", "aa_log", "aa_redact", "aa_settings"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Libraries don't import each other"
type = "independence"
modules = ["aa_log", "aa_redact", "aa_settings"]

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.rules]
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

# Crash reports stay movable into the CLIs aa init creates, or into a library of their own.
[[tool.importlinter.contracts]]
name = "Crash reports import only the standard library"
type = "forbidden"
source_modules = ["aa_cli.crash"]
forbidden_modules = ["aa_redact", "typer", "aa_cli.*"]
