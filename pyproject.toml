[project]
name = "aa-toolkit"
version = "0.0.0"
description = "Workspace root of the aa toolkit."
requires-python = ">=3.14"
dependencies = ["aa-cli"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
aa-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.99",
]

[tool.pytest.ini_options]
testpaths = ["packages/aa-cli/tests"]
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
branch = true
relative_files = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "PYI"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["aa_cli"]

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.rules]
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"
