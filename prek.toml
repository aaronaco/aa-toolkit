minimum_prek_version = "0.5.10"
default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]  # otherwise hooks run again at the commit-msg step

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "no-commit-to-branch" },
  { id = "deny-filename-pattern", name = "no agent files in repo", args = ['^(AGENTS|CLAUDE)\.md$'] },
  { id = "check-commit-trailers", args = ["--deny=Co-authored-by"], stages = ["commit-msg"] },
  { id = "deny-pattern", name = "no generated-with line", args = ['-i', 'generated with \[?claude'], stages = ["commit-msg"] },
  { id = "require-pattern", name = "conventional commit", args = ['-m', '\A(?:(?:feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\([^)]+\))?!?: \S|Merge |Revert |fixup! |squash! )'], stages = ["commit-msg"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "uv-lock", name = "uv lock check", language = "system", entry = "uv lock --check", pass_filenames = false, files = '(^|/)(pyproject\.toml|uv\.lock)$' },
  { id = "ruff-check", name = "ruff check", language = "system", entry = "uv run --locked ruff check --fix --force-exclude", types_or = ["python", "pyi"], require_serial = true },
  { id = "ruff-format", name = "ruff format", language = "system", entry = "uv run --locked ruff format --force-exclude", types_or = ["python", "pyi"], require_serial = true },
  { id = "ty", name = "ty check", language = "system", entry = "uv run --locked ty check", pass_filenames = false, types_or = ["python", "pyi"] },
]
